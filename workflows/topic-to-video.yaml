version: 1
initial: NEW
terminals: [DRAFT_READY, DELIVERED]
# mode 省略表示两种模式都可执行。requires 由宿主在提交事件的同一事务中检查。
transitions:
  - {from: NEW, event: brief_saved, to: BRIEF_READY}
  - {from: BRIEF_READY, event: research_started, to: RESEARCH_RUNNING}
  - {from: RESEARCH_RUNNING, event: evidence_saved, to: RESEARCH_REVIEW}
  - {from: RESEARCH_REVIEW, event: research_accepted, to: SCRIPT_RUNNING, mode: quality, requires: [G1]}
  - {from: RESEARCH_REVIEW, event: draft_script_requested, to: SCRIPT_RUNNING, mode: draft}
  - {from: SCRIPT_RUNNING, event: script_saved, to: SCRIPT_REVIEW}
  - {from: SCRIPT_REVIEW, event: script_accepted, to: AUDIO_RUNNING, mode: quality, requires: [G2]}
  - {from: SCRIPT_REVIEW, event: draft_audio_requested, to: AUDIO_RUNNING, mode: draft}
  - {from: AUDIO_RUNNING, event: audio_verified, to: AUDIO_READY}
  - {from: AUDIO_READY, event: alignment_verified, to: ALIGNMENT_READY}
  - {from: ALIGNMENT_READY, event: storyboard_saved, to: STORYBOARD_READY}
  - {from: STORYBOARD_READY, event: assets_resolved, to: ASSET_READY}
  - {from: ASSET_READY, event: snapshot_compiled, to: COMPILED}
  - {from: COMPILED, event: sample_render_requested, to: RENDERING, mode: quality}
  - {from: RENDERING, event: sample_rendered, to: QA_RUNNING, mode: quality}
  - {from: QA_RUNNING, event: sample_checked, to: SAMPLE_REVIEW, mode: quality, requires: [sample_qa_pass]}
  - {from: SAMPLE_REVIEW, event: sample_accepted, to: FINAL_RENDER, mode: quality, requires: [G3]}
  - {from: FINAL_RENDER, event: master_checked, to: FINAL_REVIEW, mode: quality, requires: [final_qa_pass]}
  - {from: FINAL_REVIEW, event: master_accepted, to: APPROVED, mode: quality, requires: [G4]}
  - {from: APPROVED, event: manifest_prepared, to: EXPORT_REVIEW, mode: quality}
  - {from: EXPORT_REVIEW, event: export_authorized, to: PACKAGING, mode: quality, requires: [G5]}
  - {from: PACKAGING, event: archive_verified, to: DELIVERED, mode: quality, requires: [archive_hashes_match]}
  - {from: COMPILED, event: draft_render_requested, to: DRAFT_RENDER, mode: draft}
  - {from: DRAFT_RENDER, event: labeled_draft_checked, to: DRAFT_READY, mode: draft, requires: [playable, draft_marked, issues_recorded]}
interruptions:
  pause: persist_state_and_blocked_tasks
  resume: recheck_snapshot_then_continue_from_checkpoint
  rejection: open_issue_and_reenter_earliest_affected_stage
  promote_draft: new_quality_run_reusing_matching_artifacts
