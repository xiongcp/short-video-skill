name: generate_video
version: 1.0.0
implementation: contract_only
budget_class: art
purpose: 生成选定的复杂插入镜头候选。
# 写请求的 project_id、expected_version、idempotency_key 由公共信封携带。
input_fields:
  shot_id: 镜头标识
  reference_refs: 角色与动作参考
  target_frames: 请求帧数
  candidate_count: 本次候选数
request_contract: workflow.schema.json#/$defs/ToolRequest
payload_contract: workflow.schema.json#/$defs/GenerateVideoInput
result_contract: workflow.schema.json#/$defs/ToolResult
artifact_contents: 带实测长度、模型和候选序号的视频引用。
side_effect: 默认关闭的付费候选生成
preconditions: 用户启用视频适配器，检查角色使用范围、预算和候选上限。
failure: 回执未知先对账，不可用时由导演决定是否改成分层插画或图解。
