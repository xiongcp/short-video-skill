name: inspect_media
version: 1.0.0
implementation: contract_only
budget_class: local
purpose: 只读解析媒体信息和需要抽样的画面或音频窗口。
# 写请求的 project_id、expected_version、idempotency_key 由公共信封携带。
input_fields:
  media_ref: 当前项目媒体
  expected_spec: 预期尺寸、帧率和音频规格
  sample_ranges: 需要检查的帧区间
request_contract: workflow.schema.json#/$defs/ToolRequest
payload_contract: workflow.schema.json#/$defs/InspectMediaInput
result_contract: workflow.schema.json#/$defs/ToolResult
artifact_contents: 媒体探针报告、异常帧位置、截图或波形证据引用。
side_effect: 只读媒体检查
preconditions: 素材 URI、解码范围和资源配额通过项目检查。
failure: 读取或解码失败输出 failed，缺测项返回 partial 并标识。
