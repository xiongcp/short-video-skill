name: bake_character
version: 1.0.0
implementation: contract_only
budget_class: render
purpose: 从固定起始状态顺序烘焙角色透明层。
# 写请求的 project_id、expected_version、idempotency_key 由公共信封携带。
input_fields:
  shot_id: 镜头标识
  character_plan_ref: 固定版本表演计划
  rig_ref: 已登记 Rig
  fps: 项目帧率
  frame_count: 镜头局部帧数
request_contract: workflow.schema.json#/$defs/ToolRequest
payload_contract: workflow.schema.json#/$defs/BakeCharacterInput
result_contract: workflow.schema.json#/$defs/ToolResult
artifact_contents: 带透明通道的序列或视频、末态与像素哈希。
side_effect: 本地或已配置渲染资源
preconditions: 固定 Rig、物理配置、初值、随机种子与烘焙版本。
failure: 中断后从已验证的镜头初始快照重烘当前镜头。
