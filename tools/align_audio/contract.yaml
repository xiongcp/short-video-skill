name: align_audio
version: 1.0.0
implementation: contract_only
budget_class: voice
purpose: 将分段音频和原文强制对齐。
# 写请求的 project_id、expected_version、idempotency_key 由公共信封携带。
input_fields:
  audio_ref: 已归一化的音频
  transcript_ref: 同版本原文
  language: 语言标签
request_contract: workflow.schema.json#/$defs/ToolRequest
payload_contract: workflow.schema.json#/$defs/AlignAudioInput
result_contract: workflow.schema.json#/$defs/ToolResult
artifact_contents: Alignment 的词级采样区间、置信度和 cue 映射。
side_effect: 本地运算或显式配置的服务费用
preconditions: 输入音频与文本匹配，项目约定 48 kHz。
failure: 低置信词保留时间窗供手改，空结果阻断正式时间线。
